pre-commit:
  parallel: true
  jobs:
    - name: prettier
      root: "web/"
      glob: "*.{js,ts,svelte,css,json,md,html}"
      run: bun prettier --write {staged_files}
      stage_fixed: true
    - name: eslint
      root: "web/"
      glob: "*.{js,ts,svelte}"
      run: bun eslint --fix {staged_files}
      stage_fixed: true
